      <text x="22" y="13"><a xlink:href="https://github.com/SparshKoul">https://github.com/SparshKoul</a></text>
    </g>

    <!-- LinkedIn Line -->
    <g transform="translate(15, 60)">
      <g transform="translate(0, 0) scale(0.667)">
        <path fill="#0A66C2" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
      </g>
      <text x="22" y="13"><a xlink:href="https://www.linkedin.com/in/sparshkoul">linkedin.com/in/sparshkoul</a></text>
    </g>

    <!-- Portfolio Line -->
    <g transform="translate(15, 84)">
      <g transform="translate(0, 0) scale(0.667)">
        <path fill="#0079ff" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
      </g>
      <text x="22" y="13"><a xlink:href="https://sparshkoul.live">https://sparshkoul.live</a></text>
    </g>

    <line x1="15" y1="114" x2="485" y2="114" stroke-width="1" class="divider" opacity="0.6" />
    <text x="15" y="140" font-size="14" font-weight="600">Skills &amp; Tech Stack:</text>

    <g id="skills-badge-grid">
      <!-- Skill badges injected here at build time -->
    </g>
  </g>

  <!-- typing 5 -->
